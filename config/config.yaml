# 配置文件

# 数据路径
data:
  processed_path: "data/processed/"

# 模型路径
models:
  model_path: "models/"

# NLP 配置
nlp:
  max_features: 5000
  ngram_range: [1, 2]
  stopwords_path: "data/text_features/stopwords.txt"

# 模型超参数
hyperparameters:
  kmeans:
    n_clusters: 8
    random_state: 42
    max_iter: 300
  
  neural_network:
    hidden_size: 64
    learning_rate: 0.001
    epochs: 100

